# Gradle daemon: Loom and ModDevGradle decompile/remap Minecraft, 2G is too tight.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1G

# Build speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# KSP (used by fletching-table): reuse processor classloaders across sub-projects.
ksp.classloader.cache.processors=true

# Version of the Fabric Loom plugin used by `loom-back-compat`.
# This has to be a Gradle property, because it is read before Stonecutter
# gets a chance to export the structured properties to the project.
loomx.loom_version=1.19-SNAPSHOT
