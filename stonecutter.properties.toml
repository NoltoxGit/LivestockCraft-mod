[mod]
id = "livestockcraft"
name = "LivestockCraft"
group = "fr.noltox"
version = "26.48.3"
channel_tag = "-alpha"
description = "Breeding and domestication: tame wild ancestors over generations into domestic livestock."
authors = ["Noltox"]
contributors = ["LoupSauvage"]
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/NoltoxGit/LivestockCraft-mod"
homepage_url = "https://github.com/NoltoxGit/LivestockCraft-mod"
issues_url = "https://github.com/NoltoxGit/LivestockCraft-mod/issues"
discord_url = ""
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]

[[mod.pom.developers]]
id = "noltox"
name = "Noltox"
url = "https://github.com/NoltoxGit"

[fabric]
deps.fabric-loader = "0.20.1"

[fabric."1.21.1"]
deps.minecraft = "1.21.1"
deps.fabric-api = "0.116.18+1.21.1"
deps.modmenu = "11.0.5"
# https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-fabric-1.21.1/
deps.geckolib = "4.9.4"

[neoforge]

[neoforge."1.21.1"]
deps.minecraft = "1.21.1"
deps.neoforge = "21.1.267"
# https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-neoforge-1.21.1/
deps.geckolib = "4.9.4"
