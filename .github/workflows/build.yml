name: build

# Skip the build when a push or PR only changes files that cannot affect it.
# The run is skipped only if EVERY changed file matches. Keep this list in sync
# with the "[ci skip]" rule in AGENTS.md (section 5).
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
      - '.idea/**'
      - '.vscode/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
      - '.idea/**'
      - '.vscode/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'

# Least privilege: checkout only needs to read the repository.
# upload-artifact does not use the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper            # dans build.yml uniquement, déjà présent
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build with Gradle
        run: ./gradlew buildAndCollect --no-daemon --stacktrace --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/libs/
