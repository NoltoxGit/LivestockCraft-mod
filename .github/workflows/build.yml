name: build

# Skip the build when a push or PR only changes files that cannot affect it.
# The run is skipped only if EVERY changed file matches. Keep this list in sync
# with the "[ci skip]" rule in AGENTS.md (section 5).
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
      - '.idea/**'
      - '.vscode/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
      - '.idea/**'
      - '.vscode/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'

# Least privilege: checkout only needs to read the repository.
# upload-artifact does not use the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build with Gradle
        run: ./gradlew buildAndCollect --no-daemon --stacktrace --console=plain

      # With 'archive: false' each jar is uploaded as-is (no .zip), but
      # upload-artifact then accepts exactly one file per step, so there is one
      # step per jar. The artifact is named after the file ('name' is ignored).
      - name: Upload Fabric jar
        uses: actions/upload-artifact@v7
        with:
          path: |
            build/libs/**/*-fabric+*.jar
            !build/libs/**/*-sources.jar
            !build/libs/**/*-javadoc.jar
          archive: false
          if-no-files-found: error

      - name: Upload Fabric sources jar
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/**/*-fabric+*-sources.jar
          archive: false
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v7
        with:
          path: |
            build/libs/**/*-neoforge+*.jar
            !build/libs/**/*-sources.jar
            !build/libs/**/*-javadoc.jar
          archive: false
          if-no-files-found: error

      - name: Upload NeoForge sources jar
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/**/*-neoforge+*-sources.jar
          archive: false
          if-no-files-found: error
