name: release

# Manual CalVer release (YY.0W.MINOR): Actions > release > Run workflow.
#
# 1. Computes the next version: YY.0W = ISO week-based year and zero-padded ISO week
#    of today's date (UTC), MINOR = 0 for the first release of the week, then +1 for
#    each extra release in the same week.
# 2. Writes it to stonecutter.properties.toml, regenerates CHANGELOG.md (git-cliff)
#    and builds every loader.
# 3. Commits "🔖 Release vX", tags it, creates the GitHub release with the jars,
#    then publishes to Modrinth/CurseForge when vars.PUB_MODS_ENABLE is "true".
#
# "dry-run" stops after the build: nothing is committed, tagged or uploaded.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [ alpha, beta, release ]
        default: alpha
      dry-run:
        description: "Dry run (compute version, changelog and build only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF_VERSION: "2.13.1"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      MOD_IS_RELEASE: true
      NOTES_FILE: ${{ github.workspace }}/../RELEASE_NOTES.md

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, needed for CalVer and git-cliff

      - name: Compute CalVer version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          # %g/%V = ISO week-based year and week, so the last days of December
          # that belong to week 01 are released under the next year.
          PREFIX="$(date -u +%g.%V)"
          # Highest MINOR already released this week (any channel), -1 if none.
          LAST="$(git tag --list "v${PREFIX}.*" \
            | sed -nE "s/^v${PREFIX}\.([0-9]+)(-.*)?$/\1/p" | sort -n | tail -n1)"
          MINOR=$(( ${LAST:--1} + 1 ))
          VERSION="${PREFIX}.${MINOR}"

          case "$CHANNEL" in
            release) CHANNEL_TAG="" ;;
            *) CHANNEL_TAG="-${CHANNEL}" ;;
          esac
          TAG="v${VERSION}${CHANNEL_TAG}"

          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -n "$PREVIOUS" && "$(git rev-list --count "${PREVIOUS}..HEAD")" == "0" ]]; then
            echo "::error::Nothing to release: no commit since ${PREVIOUS}."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "channel-tag=${CHANNEL_TAG}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing \`${TAG}\` (previous: \`${PREVIOUS:-none}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set mod version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL_TAG: ${{ steps.version.outputs.channel-tag }}
        run: |
          sed -i -E \
            -e "s/^version = \".*\"/version = \"${VERSION}\"/" \
            -e "s/^channel_tag = \".*\"/channel_tag = \"${CHANNEL_TAG}\"/" \
            stonecutter.properties.toml
          grep -E '^(version|channel_tag) = ' stonecutter.properties.toml

      - name: Generate changelog and release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # lets git-cliff resolve GitHub usernames
        run: |
          pipx install "git-cliff==${GIT_CLIFF_VERSION}"
          git-cliff --tag "$TAG" --output CHANGELOG.md
          git-cliff --unreleased --tag "$TAG" --strip all \
            --body "$(cat .github/release-notes.tera)" --output "$NOTES_FILE"
          cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper            # dans build.yml uniquement, déjà présent
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build
        run: ./gradlew buildAndCollect --no-daemon --stacktrace --console=plain

      - name: Commit, tag and push
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add stonecutter.properties.toml CHANGELOG.md
          printf '🔖 Release %s\n\n- Set mod version to %s\n- Update CHANGELOG.md\n' \
            "$TAG" "${TAG#v}" | git commit -F -
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main "$TAG"

      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" == "release" ]]; then FLAG="--latest"; else FLAG="--prerelease"; fi
          gh release create "$TAG" build/libs/*/*.jar \
            --verify-tag --title "$TAG" --notes-file "$NOTES_FILE" "$FLAG"

      - name: Publish to Modrinth and CurseForge
        if: ${{ !inputs.dry-run && vars.PUB_MODS_ENABLE == 'true' }}
        env:
          PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
          PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
          PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
          PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
          PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
          PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
          PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
          PUB_CHANGELOG_FILE: ${{ env.NOTES_FILE }}
        run: ./gradlew publishMods --no-daemon --stacktrace --console=plain
