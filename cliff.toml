# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Commits follow the emoji format described in AGENTS.md:
#   "{emoji} {Imperative summary}" + optional bullet list body.
# Only the subject line is used in the changelog.
#
# Full changelog:  git-cliff --output CHANGELOG.md
# Release notes:   see .github/workflows/release.yml (uses .github/release-notes.tera)

[remote.github]
owner = "NoltoxGit"
repo = "LivestockCraft-mod"

[changelog]
header = """
<!-- This file is auto-generated by git-cliff (see cliff.toml). Do not edit it manually.
     It is regenerated by the release workflow (.github/workflows/release.yml).
     To preview it locally, run: git-cliff --output CHANGELOG.md -->

# Changelog

All notable changes to LivestockCraft are documented in this file.
Versions follow [CalVer](https://calver.org/) `YY.0W.MINOR` (ISO week).

"""
body = """
{%- macro repo() -%}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}{%- endmacro -%}
{% if version -%}
    {% if previous.version -%}
        ## [{{ version | trim_start_matches(pat="v") }}]({{ self::repo() }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {%- else -%}
        ## [{{ version | trim_start_matches(pat="v") }}]({{ self::repo() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {%- endif %}
{%- else -%}
    ## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::repo() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
	# Drop the leading emoji of each entry: the section title already carries it.
	{ pattern = '(?m)^([-*]) [^\x00-\x7F]+ ', replace = "$1 " },
]

[git]
conventional_commits = false
filter_unconventional = false
# Keep one entry per commit (bullet lines in the body are details, not entries).
split_commits = false
# The number prefix in <!-- NN --> orders the sections; striptags removes it.
commit_parsers = [
	{ message = "^Merge (pull request|branch)", skip = true },
	{ message = "^Initial commit", skip = true },
	{ message = "^🔖", skip = true },
	{ message = "^✨", group = "<!-- 00 -->✨ Features" },
	{ message = "^🐛", group = "<!-- 01 -->🐛 Bug fixes" },
	{ message = "^⚡", group = "<!-- 02 -->⚡ Performance" },
	{ message = "^🎨", group = "<!-- 03 -->🎨 Models, textures and assets" },
	{ message = "^🌍", group = "<!-- 04 -->🌍 Translations" },
	{ message = "^♻️", group = "<!-- 05 -->♻️ Refactoring" },
	{ message = "^🔥", group = "<!-- 06 -->🔥 Removals" },
	{ message = "^🔧", group = "<!-- 07 -->🔧 Configuration" },
	{ message = "^🪛", group = "<!-- 08 -->🪛 Build and dependencies" },
	{ message = "^👷", group = "<!-- 09 -->👷 CI" },
	{ message = "^📝", group = "<!-- 10 -->📝 Documentation" },
	{ message = "^✅", group = "<!-- 11 -->✅ Tests" },
	{ message = "^🎉", group = "<!-- 12 -->🎉 Project setup" },
	{ message = "^🚧", group = "<!-- 13 -->🚧 Work in progress" },
	{ message = ".*", group = "<!-- 99 -->Other changes" },
]
filter_commits = false
# Release tags: v26.11.0, v26.11.1-beta, ...
tag_pattern = "^v[0-9]+\\.[0-9]{2}\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
